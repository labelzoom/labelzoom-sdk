# clippy::doc_markdown reads a camel-case word in prose as an un-backticked code item.
# "LabelZoom" is the product name and appears in nearly every doc comment; backticking it
# would render the docs as code spans throughout. ".." keeps clippy's own default list.
doc-valid-idents = ["LabelZoom", ".."]

# clippy::result_large_err fires at 128 bytes, and adding ApiError::code (rule E3) took
# Error from 104 bytes to exactly 128. The usual fix, boxing the payload as
# Error::Api(Box<ApiError>), breaks every caller's `Err(Error::Api(e))` arm for no runtime
# gain: the error path is cold, and one request costs far more than a 128-byte move.
large-error-threshold = 160
