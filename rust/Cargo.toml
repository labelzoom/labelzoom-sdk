[package]
name = "labelzoom"
version = "1.0.0"
edition = "2021"
# 1.85 is the floor for the DEFAULT build, set by the bundled rustls stack: zeroize,
# reached transitively through ureq, is edition 2024 and needs cargo >= 1.85. The
# crate's own code compiles on 1.82 with --no-default-features, but declaring that as
# the MSRV would be a floor almost nobody actually builds against.
rust-version = "1.85"
description = "Official Rust client for the LabelZoom label conversion API."
license = "MIT"
readme = "README.md"
homepage = "https://www.labelzoom.com"
repository = "https://github.com/labelzoom/labelzoom-sdk"
documentation = "https://docs.rs/labelzoom"
keywords = ["labelzoom", "zpl", "barcode", "label", "printing"]
categories = ["api-bindings"]
# tests/ reads ../conformance, which is not part of the package, and tests/typecheck holds
# snippets that must NOT compile. Neither is any use to a consumer, and shipping a test
# tree that cannot build is worse than shipping none.
exclude = ["tests/**"]

[features]
default = ["ureq-transport"]
# The bundled blocking HTTP backend. Turn it off to supply your own Transport and pull in
# no HTTP stack at all -- CI builds that configuration to prove the seam is real.
ureq-transport = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
# rustls rather than native-tls: no OpenSSL headers needed to build this crate anywhere.
ureq = { version = "3", optional = true, default-features = false, features = ["rustls"] }

[dev-dependencies]
libtest-mimic = "0.8"

# One reported trial per fixture id, so the JUnit report names the same 83 cases every
# other language's report does.
[[test]]
name = "conformance"
harness = false

[lints.rust]
missing_docs = "warn"
