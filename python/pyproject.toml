[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labelzoom-sdk"
dynamic = ["version"]
description = "Official Python SDK for the LabelZoom API. Converts barcode labels between ZPL, EPL, TSPL, DPL, PDF, LabelZoom XML/JSON and raster images."
readme = "README.md"
license = "MIT"
# A byte-identical copy of the repository LICENSE. It cannot be a parent-directory include:
# `python -m build` builds the wheel from the sdist, where ../LICENSE does not exist, so a
# source install would fail. conformance/lint.mjs asserts the copy matches the original.
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "RJF Technology Solutions LLC", email = "support@labelzoom.com" }]
keywords = ["labelzoom", "zpl", "epl", "tspl", "dpl", "zebra", "barcode", "label", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Printing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://www.labelzoom.com"
Documentation = "https://github.com/labelzoom/labelzoom-sdk/tree/main/python"
Source = "https://github.com/labelzoom/labelzoom-sdk"
Issues = "https://github.com/labelzoom/labelzoom-sdk/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.version]
path = "src/labelzoom/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/labelzoom"]

[tool.hatch.build.targets.sdist]
# The conformance fixtures live above this directory and are not shipped, so the test suite
# is excluded too -- an sdist carrying a suite that cannot run is worse than one carrying none.
include = ["src/labelzoom", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The completeness assertion in test_conformance.py depends on running after the parametrized
# cases in the same session. Do not add xdist or a shuffling plugin without reworking it.
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The typing fixtures exist to be rejected by mypy; ruff's opinions about them are noise.
"tests/typecheck/*" = ["B018", "F841"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# The conformance runner reads untyped JSON by design: the fixtures are the schema, and
# annotating every `given`/`expect` shape would duplicate spec.json in Python.
module = "tests.test_conformance"
disallow_any_expr = false
