# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  # NuGet dependencies
  - package-ecosystem: "nuget"
    directory: "/dotnet/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "nuget"
    groups:
      # Collapses the per-project PRs (src/ and tests/ are discovered separately)
      # into one. Majors stay individual so they get read rather than rubber-stamped.
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # One block per language SDK. All seven follow the nuget block's rationale above:
  # minor+patch collapse into a single PR, majors stay individual so they get read.
  # These directories are created progressively, phase by phase; Dependabot skips a
  # configured directory that does not exist yet rather than erroring.
  - package-ecosystem: "npm"
    directory: "/node/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    ignore:
      # @types/node's MAJOR tracks the Node runtime the SDK is built and published
      # against -- the latest LTS, pinned in node/.nvmrc -- not the newest release
      # line. Types ahead of the runtime describe APIs that do not exist there, so
      # `tsc --noEmit` would accept code that crashes on the very Node we ship on.
      # Patch/minor within the major still flow via npm-minor-patch below; a major
      # is a runtime decision made by editing node/.nvmrc, and check-node-types.yml
      # fails the build if the two ever disagree.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript's .d.ts pipeline inside tsup 8.5.1 does not support TS >= 6:
      #   TS 6 -> tsup injects the deprecated `baseUrl` (tsup/dist/rollup.js:6837)
      #           into the dts build, which TS 6 rejects with TS5101
      #   TS 7 -> tsup's bundled rollup-plugin-dts crashes on the new compiler API
      #           ("Cannot read properties of undefined (reading
      #           'useCaseSensitiveFileNames')")
      # Both were reproduced locally against 6.0.3 and 7.0.2. The esbuild JS build
      # succeeds either way; only declaration generation breaks, which is fatal for
      # a package whose `types` is a published entry point. Neither is fixable here.
      # Revisit -- and drop this ignore -- when tsup ships a TS >= 6 dts pipeline.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gradle"
    directory: "/java/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "java"
    groups:
      gradle-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/python/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "composer"
    directory: "/php/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "php"
    groups:
      composer-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/go/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    groups:
      gomod-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bundler"
    directory: "/ruby/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ruby"
    groups:
      bundler-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/rust/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    ignore:
      # @v1 is a MOVING major alias, moved only by a human running
      # labelzoom/.github's script/cut-release.sh. Left alone, Dependabot would
      # "helpfully" pin it to @v1.0.0 and silently undo that design.
      - dependency-name: "labelzoom/.github/*"
    groups:
      # One PR for every action bump, majors included. Ungrouped action updates
      # are the mechanism that let the pinned SHAs drift apart across the fleet.
      actions-all:
        patterns:
          - "*"
