name: Release Java

# Publishes com.labelzoom:labelzoom-sdk to Maven Central via the Central Portal.
#
# Unlike the npm and NuGet releases, this one uses REAL SECRETS. Maven Central has no OIDC
# equivalent, so the GPG private key plus its passphrase is standing publish authority for the
# whole com.labelzoom namespace. Restrict who can dispatch this workflow accordingly.
#
# Required repository secrets:
#   CENTRAL_TOKEN_USERNAME / CENTRAL_TOKEN_PASSWORD  - Central Portal user token
#   SIGNING_IN_MEMORY_KEY                            - ASCII-armoured private key, whole block
#   SIGNING_KEY_ID                                   - last 8 chars of the fingerprint
#   SIGNING_PASSPHRASE                               - passphrase protecting the key

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build, sign and bundle without uploading'
        type: boolean
        default: false
      publishing-type:
        description: 'USER_MANAGED waits for the Portal; AUTOMATIC publishes once validation passes'
        type: choice
        options:
          - USER_MANAGED
          - AUTOMATIC
        default: USER_MANAGED
  # A published GitHub Release, not a bare tag push.
  #
  # Creating a release from an EXISTING tag fires no push event at all, so tag-push
  # silently does nothing for the most common release flow. Configuring both would be
  # worse: a release that creates its tag fires both events and tries to publish the
  # same version twice.
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: publish
    # A release event is delivered to every release workflow; the tag prefix is what
    # decides which language it is actually for. Keeps the SDKs independently versioned.
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.event.release.tag_name, 'java/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write   # opens the "publish this on Central" reminder

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v4.4.4

      # No dependency cache here, deliberately -- unlike java-test.yml. A restored cache is
      # attacker-influenced input, and anything it plants would be baked into an artifact that
      # is then GPG-signed and trusted by every consumer.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v4.4.4
        with:
          cache-disabled: true

      # A tag must agree with the version it claims to release.
      - name: Verify tag matches project version
        if: github.event_name == 'release'
        env:
          # Passed as an env var rather than interpolated into the script: a tag name is
          # attacker-influenced text, and inlining it into `run:` is template injection.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag_version="${RELEASE_TAG#java/v}"
          project_version="$(./gradlew --no-daemon -q printVersion)"
          echo "tag=${tag_version} project=${project_version}"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match project version ${project_version}"
            exit 1
          fi
        working-directory: ./java

      # The release gate is the same offline conformance suite the PR builds run.
      - name: Build, test and bundle
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSPHRASE }}
        run: ./gradlew build centralBundle
        working-directory: ./java

      # Central rejects an unsigned deployment, and it does so after upload with a message that
      # takes a while to interpret. Checking here fails in seconds with an obvious reason.
      - name: Verify the bundle is signed and complete
        run: |
          set -euo pipefail
          bundle="$(ls build/central/*.zip)"
          echo "bundle: ${bundle}"
          unzip -l "$bundle"
          entries="$(unzip -Z1 "$bundle")"
          for required in \
            "com/labelzoom/labelzoom-sdk/.*/labelzoom-sdk-.*\.jar" \
            "com/labelzoom/labelzoom-sdk/.*/labelzoom-sdk-.*-sources\.jar" \
            "com/labelzoom/labelzoom-sdk/.*/labelzoom-sdk-.*-javadoc\.jar" \
            "com/labelzoom/labelzoom-sdk/.*/labelzoom-sdk-.*\.pom" \
            "com/labelzoom/labelzoom-sdk/.*/labelzoom-sdk-.*\.jar\.asc" \
            "com/labelzoom/labelzoom-sdk/.*/labelzoom-sdk-.*\.pom\.asc"
          do
            echo "$entries" | grep -Eq "$required" \
              || { echo "::error::bundle is missing an entry matching ${required}"; exit 1; }
          done
        working-directory: ./java

      - name: Upload the deployment bundle to Central
        if: ${{ !inputs.dry-run }}
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          # A release event carries no inputs, so this is what the release path uses.
          PUBLISHING_TYPE: ${{ inputs.publishing-type || 'USER_MANAGED' }}
        run: |
          set -euo pipefail
          bundle="$(ls build/central/*.zip)"
          auth="$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)"

          deployment_id="$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${auth}" \
            -F "bundle=@${bundle}" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=labelzoom-sdk&publishingType=${PUBLISHING_TYPE}")"

          echo "deployment id: ${deployment_id}"
          echo "DEPLOYMENT_ID=${deployment_id}" >> "$GITHUB_ENV"
        working-directory: ./java

      # Validation is asynchronous. Without this the workflow goes green while the deployment
      # is still validating, and a rejection is only discovered by logging into the Portal.
      - name: Wait for validation
        if: ${{ !inputs.dry-run }}
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          PUBLISHING_TYPE: ${{ inputs.publishing-type || 'USER_MANAGED' }}
        run: |
          set -euo pipefail
          auth="$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)"

          # VALIDATED is where the useful question -- did Central accept this? -- is answered.
          # Everything after it is Central's own publishing pipeline, which has run well past
          # 15 minutes; holding a runner through that buys nothing a reminder cannot.
          #
          # Under AUTOMATIC we still stop at VALIDATED rather than PUBLISHED, for the same
          # reason. The nightly reminder workflow is what confirms it actually landed.
          terminal='PUBLISHED|VALIDATED'
          echo "publishingType=${PUBLISHING_TYPE}, waiting for: ${terminal}"

          for attempt in $(seq 1 40); do
            state="$(curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer ${auth}" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}" \
              | sed -n 's/.*"deploymentState"[[:space:]]*:[[:space:]]*"\([A-Z_]*\)".*/\1/p' \
              | head -n1)"

            echo "attempt ${attempt}: ${state:-unknown}"
            case "$state" in
              FAILED)
                echo "::error::Central rejected the deployment. Open the Portal for the reason."
                exit 1
                ;;
            esac
            if echo "$state" | grep -Eq "^(${terminal})$"; then
              echo "Deployment reached ${state}."
              exit 0
            fi
            sleep 15
          done

          echo "::error::Timed out waiting for the deployment to reach ${terminal}."
          exit 1

      # USER_MANAGED means the deployment sits in the Portal until a human releases it, and
      # a workflow log is not a reminder -- nobody re-reads a green run. This issue is the
      # queue: it carries the deployment id, and central-publish-reminder.yml closes it
      # automatically once Central reports the version is actually on the repository.
      # USER_MANAGED means the deployment sits in the Portal until a human releases it, and
      # a workflow log is not a reminder -- nobody re-reads a green run. This issue is the
      # queue: it carries the deployment id, and central-publish-reminder.yml closes it
      # automatically once Central reports the version is actually on the repository.
      - name: Open a reminder to publish the deployment
        if: ${{ !inputs.dry-run && (inputs.publishing-type || 'USER_MANAGED') == 'USER_MANAGED' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(./gradlew --no-daemon -q printVersion)"

          gh label create maven-central-publish \
            --repo "$REPO" \
            --color FBCA04 \
            --description 'A Maven Central deployment is validated and awaiting manual release' \
            2>/dev/null || true

          # Heredoc written at the script's own indentation: YAML has already stripped the
          # block indent, so the body needs no dedenting afterwards.
          gh issue create --repo "$REPO" \
            --title "Publish com.labelzoom:labelzoom-sdk ${version} on Maven Central" \
            --label maven-central-publish \
            --body "$(cat <<BODY
          A deployment for \`com.labelzoom:labelzoom-sdk:${version}\` has been uploaded and
          **validated** by Maven Central, but it is \`USER_MANAGED\` - it will not reach the
          repository until someone releases it.

          **Deployment ID:** \`${DEPLOYMENT_ID}\`

          ### What to do

          1. Open the [Central Portal deployments page](https://central.sonatype.com/publishing/deployments)
          2. Find the \`labelzoom-sdk\` deployment
          3. Click **Publish** (or **Drop** to abandon this version)

          Publishing takes Central a while - well past 15 minutes at times - which is why the
          release workflow no longer waits for it.

          ### This issue closes itself

          \`central-publish-reminder.yml\` checks nightly and closes this once \`${version}\`
          is actually resolvable from Maven Central. If it is still open, the version is still
          not published.

          <sub>Opened by [this release run](https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}).</sub>
          BODY
          )"
        working-directory: ./java

      - name: Upload bundle as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: (!cancelled())
        with:
          name: maven-central-bundle
          path: java/build/central/*.zip
