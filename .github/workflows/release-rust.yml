name: Release Rust

# Publishes the labelzoom crate to crates.io via Trusted Publishing (OIDC) -- no token, no
# secret.
#
# The FILENAME of this workflow is a matched claim in the crates.io trusted publisher
# policy. Renaming this file silently breaks publishing, and the failure surfaces only at
# publish time.
#
# FIRST RELEASE IS MANUAL, and was: crates.io has no "pending" trusted publisher for a
# crate name that does not exist yet, so `labelzoom` 1.0.0 was published by hand with a
# scoped token on 2026-08-25 and the policy configured afterwards. (RubyGems is the
# opposite -- it DOES support pending publishers; see release-ruby.yml.)
#
# The trusted publisher on crates.io must be configured with, and kept matching:
#
#   repository owner   labelzoom
#   repository name    labelzoom-sdk
#   workflow filename  release-rust.yml     <- must match this file's name
#   environment        crates-io            <- must match `environment:` below
#
# Configure it as an INDIVIDUAL crate owner. crates.io deliberately does not let GitHub
# team owners change crate settings, trusted publishing included, so a crate owned only
# by a team cannot be reconfigured (rust-lang/crates.io#12710, working as designed).
#
# crates.io is IMMUTABLE: a published version can be yanked but never replaced. Everything
# below the publish step is there because of that.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and verify without publishing'
        type: boolean
        default: false
  # A published GitHub Release, not a bare tag push. Creating a release from an EXISTING
  # tag fires no push event at all, so tag-push silently does nothing for the most common
  # release flow.
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: publish
    # A release event is delivered to every release workflow; the tag prefix is what
    # decides which language it is actually for. Keeps the SDKs independently versioned.
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.event.release.tag_name, 'rust/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: crates-io
    permissions:
      id-token: write   # required for the OIDC token crates.io exchanges for a publish token
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      # No cargo cache here, deliberately -- unlike test-rust.yml. A restored cache is
      # attacker-influenced input, and anything it plants would be baked into a crate that
      # every consumer then trusts. zizmor flags this as cache poisoning; the finding is
      # correct.

      - name: Check formatting
        run: cargo fmt --check
        working-directory: ./rust

      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
        working-directory: ./rust

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-nextest

      # The release gate is the same conformance suite the PR builds run: 83 shared
      # fixtures plus the assertion that all of them executed.
      - name: Test
        run: cargo nextest run --profile ci --locked --all-features
        working-directory: ./rust

      - name: Doctests
        run: cargo test --doc --locked --all-features
        working-directory: ./rust

      # A tag must agree with the version it claims to release, or `rust/v1.0.1` quietly
      # publishes whatever Cargo.toml happens to say -- immutably.
      - name: Verify tag matches the crate version
        if: github.event_name == 'release'
        env:
          # Passed as an env var rather than interpolated into the script: a tag name is
          # attacker-influenced text, and inlining it into `run:` is template injection.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag_version="${RELEASE_TAG#rust/v}"
          crate_version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          echo "tag=$tag_version Cargo.toml=$crate_version"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match the crate version ${crate_version}"
            exit 1
          fi
        working-directory: ./rust

      - name: Verify the package contents
        run: |
          set -euo pipefail
          cargo package --locked --list > /tmp/package.txt
          cat /tmp/package.txt
          for required in src/lib.rs src/client.rs LICENSE README.md; do
            grep -qx "$required" /tmp/package.txt \
              || { echo "::error::$required is missing from the package"; exit 1; }
          done
          if grep -q '^tests/' /tmp/package.txt; then
            echo "::error::tests/ must not be packaged"; exit 1
          fi
        working-directory: ./rust

      # Runs on a dry run TOO, deliberately. This exchange is the only thing that proves
      # the crates.io trusted-publisher configuration is correct -- the repository,
      # workflow filename and environment all have to match, and a mismatch is invisible
      # until something tries to authenticate. Skipping it on a dry run would mean the
      # first test of that config is a real release, which is exactly the wrong time to
      # find out. The token it mints is short-lived and, on a dry run, simply unused.
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Confirm trusted publishing works
        run: |
          set -euo pipefail
          if [ -z "${AUTH_TOKEN}" ]; then
            echo "::error::crates.io returned no token. The trusted publisher config does not match this workflow: check owner=labelzoom, repo=labelzoom-sdk, workflow=release-rust.yml, environment=crates-io."
            exit 1
          fi
          echo "trusted publishing OK - crates.io issued a token for this workflow"
        env:
          AUTH_TOKEN: ${{ steps.auth.outputs.token }}

      # crates.io is immutable and rejects a re-upload of an existing version, so without
      # this a re-run -- or a release cut for a version already pushed by hand, which is
      # how 1.0.0 got there -- fails a run that had nothing left to do.
      - name: Check whether this version is already on crates.io
        id: published
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          # crates.io asks that automated clients identify themselves.
          if curl -sSf -H "User-Agent: labelzoom-sdk-release (https://github.com/labelzoom/labelzoom-sdk)" \
               "https://crates.io/api/v1/crates/labelzoom/${version}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::labelzoom ${version} is already on crates.io; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: ./rust

      - name: Publish to crates.io
        if: ${{ !inputs.dry-run && steps.published.outputs.exists == 'false' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
        working-directory: ./rust

      - name: Dry run summary
        if: ${{ inputs.dry-run }}
        run: echo "Dry run complete - built, linted, tested and verified; publish skipped."
