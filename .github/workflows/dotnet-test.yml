name: .NET Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'dotnet/**'
      - 'conformance/**'
      - '.github/workflows/dotnet-test.yml'
  # No base-branch filter on purpose. The language SDKs land as a stack of PRs, each
  # based on the previous one, and `branches: [main]` means every PR in that stack
  # except the bottom gets zero checks -- the code that most needs compiling is the
  # code CI silently skips.
  pull_request:
    paths:
      - 'dotnet/**'
      # The conformance fixtures ARE the contract. A fixture change has to re-run every
      # language suite, or a "harmless" edit lands green against none of them.
      - 'conformance/**'
      - '.github/workflows/dotnet-test.yml'

# Cancel in-progress runs for the same workflow and branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        # Matches the test project's net8.0. src multi-targets netstandard2.0 (for
        # .NET Framework 4.6.1+ consumers) and net8.0, both buildable with this SDK.
        dotnet-version: '8.0.x'

    # setup-dotnet's built-in `cache: true` needs a packages.lock.json, and this
    # solution has none. Keying on the csproj files is the workable alternative;
    # switch to the built-in cache if lock files are ever adopted.
    - name: Cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('dotnet/**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./dotnet

    - name: Build
      run: dotnet build --no-restore --configuration Release
      working-directory: ./dotnet

    # No secrets, no network. Everything here is served by a stubbed HttpMessageHandler,
    # so this passes identically on a fork pull request -- which is what the previous
    # suite could not do: it threw in its constructor when the token was unset, turning
    # every fork PR red. Live tests live in live-tests.yml and are excluded by category.
    - name: Test
      run: >-
        dotnet test --no-build --configuration Release --verbosity normal
        --filter "Category!=Integration"
        --logger "junit;LogFilePath=../test-results/dotnet.xml"
      working-directory: ./dotnet

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: (!cancelled())
      with:
        name: test-results
        path: test-results/**/*.xml
