name: Python Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'python/**'
      - 'conformance/**'
      - '.github/workflows/test-python.yml'
  # No base-branch filter: the language SDKs land as a stack of PRs, and `branches: [main]`
  # would give every PR in that stack except the bottom zero checks.
  pull_request:
    paths:
      - 'python/**'
      # The conformance fixtures ARE the contract. A fixture change has to re-run every
      # language suite, or a "harmless" edit lands green against none of them.
      - 'conformance/**'
      - '.github/workflows/test-python.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # The version that lints, type-checks and uploads the JUnit report. The others only run
  # the suite. Picked as the oldest supported, so a 3.10-incompatible construct fails in
  # the lint job rather than in one matrix cell that is easy to skim past.
  PRIMARY_PYTHON: '3.10'

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling both matter: `X | Y` annotations need 3.10, and the
        # newest release is where httpx and asyncio behaviour changes show up first.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
        working-directory: ./python

      - name: Lint
        if: matrix.python-version == env.PRIMARY_PYTHON
        run: |
          ruff check
          ruff format --check src tests
        working-directory: ./python

      # This is what makes conformance/skips/python.json honest. The four typecheck/* cases
      # are declared skipped because Python has no compile step -- tests/typecheck/ asserts them
      # with inverted `# type: ignore` comments under `warn_unused_ignores`, so a target
      # union that wrongly gained `epl` fails HERE rather than passing silently.
      - name: Typecheck
        if: matrix.python-version == env.PRIMARY_PYTHON
        run: mypy
        working-directory: ./python

      # No secrets, no network: the transport is an httpx.MockTransport, so this passes
      # identically on a fork pull request. Every fixture runs through both the sync and the
      # async client.
      - name: Test
        run: pytest --junitxml="${{ github.workspace }}/test-results/python.xml"
        working-directory: ./python

      # A package that builds but ships no code installs happily and breaks every consumer's
      # import. Assert the real artifacts rather than trusting that the build ran -- and
      # build the wheel FROM the sdist, which is the path that broke when the LICENSE was a
      # parent-directory include.
      - name: Verify the publishable artifacts
        if: matrix.python-version == env.PRIMARY_PYTHON
        run: |
          set -euo pipefail
          python -m pip install --upgrade build twine
          python -m build --outdir dist
          twine check dist/*
          python -c "
          import glob, sys, zipfile
          names = set(zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist())
          required = {'labelzoom/__init__.py', 'labelzoom/client.py', 'labelzoom/py.typed'}
          missing = required - names
          if missing:
              sys.exit(f'missing from the wheel: {sorted(missing)}')
          if not any(n.endswith('licenses/LICENSE') for n in names):
              sys.exit('the wheel carries no LICENSE')
          print('wheel contents OK')
          "
        working-directory: ./python

      - name: Upload test results
        # One upload only: artifact names are unique per run, so uploading from every
        # matrix cell would collide rather than merge.
        if: ${{ !cancelled() && matrix.python-version == env.PRIMARY_PYTHON }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: test-results/
