# Caller stub. The reporter itself lives in labelzoom/.github.
#
# The per-language BUILD workflows stay local: each needs its own toolchain setup, and
# a reusable workflow would buy indirection without deduplication. The reporter is
# genuinely shared. Every language emits JUnit XML (the .NET project uses
# JunitXml.TestLogger) so one reporter covers them all -- this costs the richer
# .NET-specific detail dotnet-trx gave, and buys not maintaining seven of these.
#
# Every language workflow uploads its results as an artifact named `test-results`.
# Artifacts are scoped to a workflow RUN, so the shared name cannot collide even when
# all three languages run against the same commit.
name: 'Test Report'

# zizmor flags workflow_run as fundamentally dangerous, and for the usual usage it
# is: the job runs in the BASE repo's context with its secrets, so checking out and
# executing PR code would be arbitrary code execution. This job checks out nothing
# and runs nothing but dorny/test-reporter, which downloads an artifact and parses
# the result file. The residual risk is confined to that parser.
on:  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    # One entry per language suite. All of them emit JUnit XML so this stays a
    # single stub rather than one near-identical caller per language.
    workflows: ['.NET Tests', 'Node Tests', 'Java Tests', 'Python Tests', 'PHP Tests']
    types:
      - completed

permissions: {}

jobs:
  # A build that fails BEFORE running tests uploads nothing, and dorny/test-reporter
  # treats an absent artifact as an error. That turns one honest red X on the build
  # into two, the second of which says nothing the first did not. Probing first means
  # the reporter runs only when there is something to report.
  probe:
    name: probe
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      found: ${{ steps.probe.outputs.found }}
    steps:
      - name: Look for a test-results artifact on the triggering run
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          count="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" \
            --jq '[.artifacts[] | select(.name == "test-results")] | length')"
          echo "test-results artifacts on run ${RUN_ID}: ${count}"
          if [ "$count" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No test-results artifact on run ${RUN_ID}; the build likely failed before running tests. Skipping the report."
          fi

  report:
    needs: probe
    if: needs.probe.outputs.found == 'true'
    uses: labelzoom/.github/.github/workflows/test-report.yml@v1
    with:
      check-name: ${{ github.event.workflow_run.name }}
      path: '**/*.xml'
      reporter: java-junit
    permissions:
      contents: read
      actions: read
      checks: write
