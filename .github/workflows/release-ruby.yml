name: Release Ruby

# Publishes the labelzoom gem to RubyGems via Trusted Publishing (OIDC) -- no token, no
# secret.
#
# The FILENAME of this workflow is a matched claim in the RubyGems trusted publisher
# policy. Renaming this file silently breaks publishing, and the failure surfaces only at
# publish time.
#
# NO MANUAL FIRST PUBLISH NEEDED. RubyGems supports a PENDING trusted publisher: configure
# it against a gem name that does not exist yet, and the first successful push converts it
# into a normal publisher and makes you the gem owner. Configure it under your RubyGems.org
# profile (not under the gem, which does not exist), with:
#
#   gem name           labelzoom
#   repository owner   labelzoom
#   repository name    labelzoom-sdk
#   workflow filename  release-ruby.yml     <- must match this file's name
#   environment        rubygems             <- must match `environment:` below
#
# crates.io is the one that genuinely requires a manual first publish; see
# release-rust.yml.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and verify without publishing'
        type: boolean
        default: false
  # A published GitHub Release, not a bare tag push. Creating a release from an EXISTING
  # tag fires no push event at all, so tag-push silently does nothing for the most common
  # release flow.
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: publish
    # A release event is delivered to every release workflow; the tag prefix is what
    # decides which language it is actually for. Keeps the SDKs independently versioned.
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.event.release.tag_name, 'ruby/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: rubygems
    permissions:
      id-token: write   # required for the OIDC token RubyGems exchanges for publish rights
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          # No bundler cache here, deliberately -- unlike test-ruby.yml. A restored cache
          # is attacker-influenced input, and anything it plants would be baked into a gem
          # that every consumer then trusts. zizmor flags this as cache poisoning; the
          # finding is correct.
          bundler-cache: false
          working-directory: ./ruby

      - name: Install dependencies
        run: bundle install --jobs 4
        working-directory: ./ruby

      - name: Lint
        run: bundle exec rubocop
        working-directory: ./ruby

      # The release gate is the same conformance suite the PR builds run: the shared
      # fixtures plus the assertion that all of them executed.
      - name: Test
        run: bundle exec rspec
        working-directory: ./ruby

      # A tag must agree with the version it claims to release, or `ruby/v1.0.1` quietly
      # publishes whatever version.rb happens to say.
      - name: Verify tag matches the gem version
        if: github.event_name == 'release'
        env:
          # Passed as an env var rather than interpolated into the script: a tag name is
          # attacker-influenced text, and inlining it into `run:` is template injection.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag_version="${RELEASE_TAG#ruby/v}"
          gem_version="$(ruby -Ilib -e 'require "labelzoom/version"; print LabelZoom::VERSION')"
          echo "tag=$tag_version version.rb=$gem_version"
          if [ "$tag_version" != "$gem_version" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match LabelZoom::VERSION ${gem_version}"
            exit 1
          fi
        working-directory: ./ruby

      # An empty gem installs happily and breaks every consumer's require, so check the
      # artifact rather than trusting that the gemspec's file glob matched.
      - name: Verify the gem contains the library
        run: |
          set -euo pipefail
          gem build labelzoom.gemspec
          gem unpack ./labelzoom-*.gem --target /tmp/gemcheck
          unpacked="$(find /tmp/gemcheck -maxdepth 1 -type d -name 'labelzoom-*' | head -n1)"
          for required in lib/labelzoom.rb lib/labelzoom/client.rb LICENSE README.md; do
            test -f "${unpacked}/${required}" \
              || { echo "::error::${required} is missing from the gem"; exit 1; }
          done
          # Left in place on purpose: the publish step pushes this exact artifact, so what
          # ships is what was just verified rather than a second, unchecked build.
          ls -l ./labelzoom-*.gem
        working-directory: ./ruby

      # Deliberately NOT rubygems/release-gem, which is the obvious choice and is wrong
      # for this repository: it runs `bundle exec rake release`, and bundler's release
      # task creates and pushes a git tag of its own named `v<version>`. This repo tags
      # `ruby/v<version>` so eight SDKs can version independently, and it has an ACTIVE
      # ruleset blocking creation of `refs/tags/v*`, so that push would be rejected --
      # after the gem had already been pushed to RubyGems, which is not undoable.
      #
      # So take the OIDC credential step that release-gem wraps, and push the gem
      # directly. The tag already exists; the GitHub Release is what triggered this run.
      - name: Configure RubyGems credentials
        if: ${{ !inputs.dry-run }}
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      # No stored credential: trusted publishing supplied it over OIDC above.
      - name: Publish to RubyGems
        if: ${{ !inputs.dry-run }}
        run: gem push ./labelzoom-*.gem
        working-directory: ./ruby

      # `gem push` returns before the gem is queryable. Confirm it actually landed rather
      # than reporting success on an upload that was still being processed.
      - name: Verify the gem is live on RubyGems
        if: ${{ !inputs.dry-run }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(ruby -Ilib -e 'require "labelzoom/version"; print LabelZoom::VERSION')"
          for attempt in 1 2 3 4 5 6; do
            if curl -sSf "https://rubygems.org/api/v1/versions/labelzoom.json" \
                 | grep -q "\"number\":\"${version}\""; then
              echo "labelzoom ${version} is live on RubyGems"
              exit 0
            fi
            echo "attempt ${attempt}: not indexed yet, waiting"
            sleep 20
          done
          echo "::error::labelzoom ${version} did not appear on RubyGems"
          exit 1
        working-directory: ./ruby

      - name: Dry run summary
        if: ${{ inputs.dry-run }}
        run: echo "Dry run complete - built and verified, publish skipped."
